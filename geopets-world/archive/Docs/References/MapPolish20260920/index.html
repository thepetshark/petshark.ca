<!doctype html><meta charset="utf-8"><title>Road and biome polish — actual Game view</title>
<style>body{background:#172524;color:#e8eee8;font:16px system-ui;margin:24px}select{font:inherit;padding:6px;margin:8px}main{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0}img{width:min(390px,90vw);height:auto}figcaption{margin:8px 0}a{color:#b6d7b4}</style>
<h1>Road wear and biome transitions</h1><p>Real game captures, not mockups: actual 390×844 Unity Game view · September 20, 2026.</p><p>Roads gain worn, uneven edges, and the borders between biomes blend softly instead of ending in a hard line. Pick a place and a camera to compare the same view before and after.</p>
<label>Location <select id="site"><option value="new-west">Test area</option><option value="waterfront">Waterfront</option><option value="central-park">Central Park</option></select></label>
<label>Camera <select id="pose"><option value="normal">Default zoom</option><option value="near">Zoomed in</option><option value="far">Zoomed out</option><option value="orbit">Rotated</option><option value="return-before">Before a Hometown visit (Central Park)</option><option value="return-after">After a Hometown visit (Central Park)</option></select></label>
<main><figure><figcaption>Before</figcaption><img id="before" alt="Before road and biome polish"></figure><figure><figcaption>After</figcaption><img id="after" alt="After road and biome polish"></figure></main>
<script>function show(){if(pose.value.startsWith('return'))site.value='central-park';for(const stage of ['before','after'])document.getElementById(stage).src=stage+'/'+site.value+'-'+pose.value+'.png'}site.onchange=pose.onchange=show;show()</script>
