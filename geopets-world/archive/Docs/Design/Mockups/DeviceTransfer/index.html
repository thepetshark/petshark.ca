<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geo Pets World · Device transfer preview</title><link rel="stylesheet" href="../StartupAccounts/styles.css"></head>
<body>
<main class="review"><div class="phone"><div class="artwork"></div><div class="app">
<section class="splash"><div class="brand"><span class="brand-title">Geo Pets</span><span class="brand-world">WORLD</span><div class="brand-rule"></div></div><div class="splash-space"></div><div class="welcome"><h2>Welcome back.</h2><p>Your world is ready when you are.</p><div class="identity"><span class="identity-dot"></span><span>willow@example.test</span></div><button class="primary" id="continue">CONTINUE</button><div class="account-options"><button class="plain subtle" id="other">Preview other device</button></div></div><p class="splash-footer">INTERACTIVE DESIGN PREVIEW</p></section>
</div><div class="overlay" id="overlay"></div></div></main>
<script>
const overlay=document.getElementById('overlay');
function show(displaced=false){
  overlay.innerHTML=`<div class="scrim"><section class="sheet confirmation" role="dialog" aria-modal="true" aria-labelledby="title"><div class="handle"></div><header class="sheet-head"><h2 class="sheet-title" id="title">${displaced?'Account moved':'Play on this device?'}</h2></header><p class="sheet-copy">${displaced?'Your account was opened on another device.':'This account is linked to another device. Transfer it here to continue your saved game.'}</p>${displaced?'':'<div class="warning-panel">The previous device will lose access. Progress that hasn’t synced from it will not transfer.</div>'}<div class="stack"><button class="primary" id="confirm">${displaced?'Back to start':'Transfer & continue'}</button>${displaced?'':'<button class="secondary" id="cancel">Cancel</button>'}</div></section></div>`;
  document.getElementById('confirm').onclick=()=>{overlay.innerHTML='';document.querySelector('.welcome p').textContent=displaced?'Sign in to continue.':'Preview only — no account data was changed.';};
  const cancel=document.getElementById('cancel');if(cancel)cancel.onclick=()=>overlay.innerHTML='';
}
document.getElementById('continue').onclick=()=>show();document.getElementById('other').onclick=()=>show(true);show(new URLSearchParams(location.search).has('displaced'));
</script></body></html>
