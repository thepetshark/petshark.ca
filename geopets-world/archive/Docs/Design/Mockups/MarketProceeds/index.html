<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market payment collection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e1e8d8;color:#24483b;font:15px Arial,sans-serif}button{font:inherit;cursor:pointer;border:0;color:inherit}button:focus-visible{outline:3px solid #58acb3;outline-offset:3px}.phone{position:relative;max-width:390px;height:844px;max-height:100dvh;margin:auto;background:#faf4e5;display:flex;flex-direction:column;overflow:hidden}.head{display:flex;align-items:center;gap:12px;padding:24px 16px 17px;background:#fffbef}.close{width:40px;height:40px;border-radius:50%;background:#e7eadb;font-size:25px}.head h1{font:600 24px Georgia,serif;margin:0;flex:1}.money{display:flex;align-items:center;gap:5px;background:#f5e6bf;border-radius:18px;padding:8px 10px;font-weight:700}.coin{width:19px;height:19px;object-fit:contain}.tabs{display:flex;gap:4px;padding:0 12px;background:#fffbef;border-bottom:1px solid #d9ddc7}.tab{flex:1;padding:15px 0;font-size:12px;background:none;color:#748274}.active{color:#24483b;font-weight:bold;border-bottom:3px solid #467557}.scroll{flex:1;overflow:auto;padding:0 15px}.date{font-size:11px;color:#77836d;letter-spacing:1px;margin:20px 0 8px}.row{display:flex;align-items:center;gap:10px;min-height:75px;border-bottom:1px solid #e0e2cf}.item{width:43px;height:43px;object-fit:contain;padding:5px;background:#e8eddb;border-radius:11px}.label{flex:1;min-width:0}.label strong{display:block;font-size:14px}.label small{display:block;font-size:11px;color:#76806a;margin-top:6px}.collect{width:106px;min-height:46px;border-radius:12px;background:#38674e;color:#fffaf0;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700;box-shadow:0 3px 0 #274c39}.collect .coin{width:16px;height:16px}.collected{width:106px;text-align:right;font-size:12px;color:#7b8572}.collected b{display:block;font-size:15px;margin-bottom:4px;color:#80652f}.foot{padding:13px 16px 26px;border-top:1px solid #d9ddc7;font-size:11px;display:flex;justify-content:space-between;background:#f0f1e1}.foot button{background:none;font-size:11px;text-decoration:underline}.toast{position:absolute;top:82px;right:12px;background:#fffbee;border:1px solid #c5d1b7;border-radius:14px;padding:13px 18px;box-shadow:0 6px 18px #24483b24;display:none;align-items:center;gap:8px;font-weight:bold;z-index:2}.offline .collect{background:#adb5a3;box-shadow:none}.overlay{position:absolute;inset:0;background:#1b382d80;display:grid;place-items:center;padding:25px}.dialog{background:#fffbed;padding:22px;border-radius:20px;text-align:center}.dialog button{background:#38674e;color:white;border-radius:12px;min-height:44px;padding:10px 20px}.overlay[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:14px 0}.offer{min-height:130px;padding:5px 3px;background:#fffdf7;border:1px solid #d9ddc7;border-radius:10px;text-align:center;font-size:11px}.offer .item{width:49px;height:49px;background:none;padding:0}.offer strong,.offer small{display:block;margin:3px 0}.offer small{color:#467557}.offer .collect{width:100%;min-height:44px;font-size:11px;box-shadow:none;border-radius:7px}.offer .price{display:block;margin:10px 0;color:#80652f;font-weight:bold}.tab:disabled{opacity:.55;cursor:default}
</style>
<p style="max-width:390px;margin:0 auto;padding:14px 18px 10px;font:13px/1.5 Arial,sans-serif;color:#4b6354">When an item sells, its coins wait in the market until the seller taps Collect. Try Collect on a sale, then Preview offline.</p><main class="phone" id="phone">
<header class="head"><button class="close" id="close" aria-label="Close market">×</button><h1>Market</h1><span class="money"><img class="coin" src="../PublicMarket/icons/coin_gold.png" alt="Coins"><span id="wallet">250</span></span></header>
<nav class="tabs" aria-label="Market views"><button class="tab" disabled>Browse</button><button class="tab" disabled>Sell</button><button id="listings" class="tab active" aria-current="page">My listings</button><button id="history" class="tab">History</button></nav>
<section class="scroll" aria-label="Your listings and sales"><div id="rows"></div></section>
<footer class="foot"><span id="status">● Connected</span><button id="offline">Preview offline</button><button id="reset">Reset preview</button></footer>
<div class="toast" role="status" id="toast"><img class="coin" src="../PublicMarket/icons/coin_gold.png" alt=""><span></span></div>
<div class="overlay" id="closed" hidden><div class="dialog"><p>Market closed</p><button id="reopen">Reopen market</button></div></div>
</main>
<script>
let wallet=250,offline=false,timer,tab='listings';const sales=[{name:'8 Wheat',icon:'wheat',coins:40,time:'Just now'},{name:'5 Blackberries',icon:'blackberry',coins:35,time:'12 minutes ago'},{name:'10 Softwood',icon:'log',coins:40,time:'32 minutes ago'},{name:'4 Wheat',icon:'wheat',coins:20,time:'Today · 9:14 AM',paid:true},{name:'6 Blackberries',icon:'blackberry',coins:42,time:'Today · 8:50 AM',paid:true}];
function draw(){
 document.getElementById('wallet').textContent=wallet;
 for(const name of ['listings','history']){const b=document.getElementById(name);b.classList.toggle('active',tab===name);b.setAttribute('aria-current',tab===name?'page':'false');}
 const rows=document.getElementById('rows');rows.className=tab==='listings'?'grid':'';
 const button=(s,i)=>`<button class="collect" data-sale="${i}" ${offline?'disabled':''} aria-label="Collect ${s.coins} Coins for ${s.name}">Collect ${s.coins} Coins</button>`;
 rows.innerHTML=sales.map((s,i)=>tab==='listings'?(s.paid?'':`<div class="offer"><img class="item" src="../PublicMarket/icons/${s.icon}.png" alt=""><strong>${s.name}</strong><small>SOLD</small>${button(s,i)}</div>`):`<div class="row"><img class="item" src="../PublicMarket/icons/${s.icon}.png" alt=""><div class="label"><strong>${s.name}</strong><small>${s.time}</small></div>${s.paid?`<div class="collected"><b>${s.coins} Coins</b>✓ Collected</div>`:button(s,i)}</div>`).join('');
 if(tab==='listings')rows.innerHTML+='<div class="offer"><img class="item" src="../PublicMarket/icons/wheat.png" alt=""><strong>8 Wheat</strong><small>LISTED</small><span class="price">40 Coins</span></div>';
 document.querySelectorAll('[data-sale]').forEach(b=>b.onclick=()=>{const s=sales[+b.dataset.sale];if(s.paid||offline)return;s.paid=true;wallet+=s.coins;draw();const t=document.getElementById('toast');t.querySelector('span').textContent=`+${s.coins} Coins`;t.style.display='flex';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',3000);});
}
for(const name of ['listings','history'])document.getElementById(name).onclick=()=>{tab=name;draw();};
document.getElementById('offline').onclick=()=>{offline=!offline;document.getElementById('phone').classList.toggle('offline',offline);document.getElementById('status').textContent=offline?'Reconnect to collect payment':'● Connected';document.getElementById('offline').textContent=offline?'Go online':'Preview offline';draw();};document.getElementById('reset').onclick=()=>location.reload();document.getElementById('close').onclick=()=>document.getElementById('closed').hidden=false;document.getElementById('reopen').onclick=()=>document.getElementById('closed').hidden=true;draw();
</script></html>
