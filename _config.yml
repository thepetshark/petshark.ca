# Pet Shark Productions - https://petshark.ca
# Built by GitHub Pages' own Jekyll build, so only plugins on GitHub's allowlist can be used
# (see AGENTS.md). This file is owner-approved territory: ask before changing it.

title: Pet Shark Productions
url: https://petshark.ca
baseurl: ""
lang: en
logo: /assets/img/petshark-logo.png     # structured data (jekyll-seo-tag)
image: /assets/img/og-default.jpg       # default social-share image; a page can set its own `image:`

plugins:
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Jekyll skips folders that start with "_"; list here any that must be published anyway.
include:
  - _GeoPets   # geopets-world/archive/Assets/_GeoPets (Geo Pets World Dev Log files)

# Repo files that are not part of the website.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - node_modules
  - vendor
